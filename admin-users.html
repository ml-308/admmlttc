<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>管理员 - 用户信息</title>
    <link rel="stylesheet" href="style/index.css">
    <link rel="stylesheet" href="style/timetable.css">
    <script src="lib/ui/init.mjs" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <hcw-button flat fill class="btn-min-md" id="backBtn">返回面板</hcw-button>
        <div class="logo-area">
            <div class="logo-text">MLTTC - 用户信息</div>
        </div>
        <p hidden-on-mobile class="header-note">管理员面板</p>
        <div id="headerAuthArea">
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <span class="header-email" id="adminEmailDisplay"></span>
            <hcw-button id="logoutBtn" flat class="btn-min-sm btn-sm">退出</hcw-button>
        </div>
    </hcw-body-header>

    <hcw-article>
        <hcw-card>
            <hcw-card-title class="card-title-row">
                <span>用户列表</span>
                <span id="userCount" class="meta-count">0 人</span>
            </hcw-card-title>
            <div id="userLoading" class="state-loading-lg">加载中...</div>
            <div id="userError" class="hidden state-error-lg">
                加载失败
                <hcw-button id="retryBtn" flat class="btn-min-sm btn-sm mt-sm">重试</hcw-button>
            </div>
            <div id="userEmpty" class="hidden state-loading-lg">暂无用户</div>
            <div id="userListWrapper" class="hidden mt-sm">
                <div class="list-stack" id="userList"></div>
                <div id="userPagination" class="pagination-bar hidden">
                    <hcw-button id="userPrevBtn" flat class="btn-min-sm btn-sm">上一页</hcw-button>
                    <span id="userPageInfo" class="meta-count">0/0</span>
                    <hcw-button id="userNextBtn" flat class="btn-min-sm btn-sm">下一页</hcw-button>
                </div>
            </div>
        </hcw-card>
    </hcw-article>

    <hcw-body-footer></hcw-body-footer>

    <script src="/src/pages/admin-users.js" type="module"></script>
</body>

</html>
