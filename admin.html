<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>管理员面板</title>
    <link rel="stylesheet" href="style/index.css">
    <link rel="stylesheet" href="style/timetable.css">
    <script src="lib/ui/init.mjs" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <hcw-button flat fill class="btn-min-md" id="backBtn">返回首页</hcw-button>
        <div class="logo-area">
            <div class="logo-text">MLTTC - 管理员面板</div>
        </div>
        <p hidden-on-mobile class="header-note">管理员主页</p>
        <div id="headerAuthArea">
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <span class="header-email" id="adminEmailDisplay"></span>
            <hcw-button id="logoutBtn" flat class="btn-min-sm btn-sm">退出</hcw-button>
        </div>
    </hcw-body-header>

    <hcw-article>
        <!-- 管理员个人信息卡片 -->
        <hcw-card id="profileCard">
            <hcw-card-title class="card-title-row-start">
                <span>管理员信息</span>
            </hcw-card-title>
            <div id="profileLoading" class="state-loading">加载中...</div>
            <div id="profileContent" class="hidden profile-grid">
                <div class="profile-field">
                    <span class="profile-field-label">昵称</span>
                    <div class="profile-field-value profile-field-value--strong" id="profileName">—</div>
                </div>
                <div class="profile-field profile-field--wide">
                    <span class="profile-field-label">邮箱</span>
                    <div class="profile-field-value" id="profileEmail">—</div>
                </div>
                <div class="profile-field">
                    <span class="profile-field-label">身份</span>
                    <div class="role-badge role-user" id="profileRole">—</div>
                </div>
            </div>
            <div id="profileError" class="hidden state-error">加载失败</div>
        </hcw-card>

        <!-- 6 大功能按钮 -->
        <hcw-card class="mt-lg">
            <hcw-card-title class="card-title-sm">功能菜单</hcw-card-title>
            <div class="admin-dashboard-grid">
                <hcw-button class="dashboard-btn" primary flat data-href="/admin-review.html">时刻表审核</hcw-button>
                <hcw-button class="dashboard-btn" flat data-href="/admin-users.html">用户信息</hcw-button>
                <hcw-button class="dashboard-btn" disabled flat>系统设置</hcw-button>
                <hcw-button class="dashboard-btn" disabled flat>数据统计</hcw-button>
                <hcw-button class="dashboard-btn" disabled flat>线路管理</hcw-button>
                <hcw-button class="dashboard-btn" disabled flat>日志记录</hcw-button>
            </div>
        </hcw-card>
    </hcw-article>

    <hcw-body-footer></hcw-body-footer>

    <script src="/src/pages/admin.js" type="module"></script>
</body>

</html>
