<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>管理员 - 时刻表审核</title>
    <link rel="stylesheet" href="style/index.css">
    <link rel="stylesheet" href="style/timetable.css">
    <link rel="stylesheet" href="style/timetable-detail.css">
    <script src="lib/ui/init.mjs" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <hcw-button flat fill class="btn-min-md" id="backBtn">返回</hcw-button>
        <div class="logo-area">
            <div class="logo-text">MLTTC - 时刻表审核</div>
        </div>
        <p hidden-on-mobile class="header-note">管理员面板</p>
        <div id="headerAuthArea">
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <span class="header-email" id="adminEmailDisplay"></span>
            <hcw-button id="logoutBtn" flat class="btn-min-sm btn-sm">退出</hcw-button>
        </div>
    </hcw-body-header>

    <hcw-article>
        <!-- 时刻表审核页面：审核入口按钮 + 已审核时刻表 -->
        <div id="reviewEntrance">
            <div class="menu-bar">
                <hcw-button id="startReviewBtn" primary flat class="btn-min-2xl">
                    审核时刻表
                </hcw-button>
            </div>

            <!-- 已审核时刻表（卡片 + 删除按钮） -->
            <hcw-card class="mt-lg">
                <hcw-card-title class="card-title-row">
                    <span class="text-success">已审核时刻表</span>
                    <span id="reviewedCount" class="meta-count">0 条</span>
                </hcw-card-title>
                <div id="reviewedLoading" class="state-loading-lg">加载中...</div>
                <div id="reviewedEmpty" class="hidden state-loading-lg">暂无已审核时刻表</div>
                <div id="reviewedList" class="result-area result-list mt-sm"></div>
            </hcw-card>
        </div>

        <!-- 审核工作区：点击"审核时刻表"后逐条展示未审核时刻表 -->
        <div id="reviewWorkArea" class="hidden">

            <!-- 加载状态 -->
            <div id="reviewLoading" class="detail-loading">加载中...</div>

            <!-- 无待审核 / 全部处理完毕（可返回时刻表审核页面） -->
            <div id="reviewEmpty" class="detail-loading hidden">
                <p id="reviewEmptyText">暂无待审核时刻表</p>
                <hcw-button id="reviewBackBtn" primary flat class="btn-min-xl mt-md">返回</hcw-button>
            </div>

            <!-- 单条待审核时刻表详情（参考 mlttc 搜索详情页） -->
            <div id="reviewCard" class="hidden">
                <hcw-card>
                    <hcw-card-title class="card-title-row">
                        <span id="reviewTitle">时刻表审核</span>
                        <span id="reviewProgress" class="meta-count">0/0</span>
                    </hcw-card-title>

                    <!-- 基本信息 -->
                    <div class="detail-info-grid mt-sm">
                        <div class="detail-info-item">
                            <span class="detail-label">ID</span>
                            <span class="detail-value" id="rvId">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">城市</span>
                            <span class="detail-value" id="rvCity">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">线路</span>
                            <span class="detail-value" id="rvWay">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">起点</span>
                            <span class="detail-value" id="rvStart">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">终点</span>
                            <span class="detail-value" id="rvEnd">—</span>
                        </div>
                        <div class="detail-info-item full-width">
                            <span class="detail-label">备注</span>
                            <span class="detail-value" id="rvSpecial">—</span>
                        </div>
                    </div>

                    <!-- 发车时间（参考 mlttc 搜索详情页） -->
                    <div class="mt-xl">
                        <h3 class="detail-section-title">主站-&gt;副站[外环]</h3>
                        <div class="detail-time-grid" id="rvTime1"></div>
                    </div>
                    <div class="mt-md">
                        <h3 class="detail-section-title">副站-&gt;主站[内环]</h3>
                        <div class="detail-time-grid" id="rvTime2"></div>
                    </div>

                    <!-- 元信息 -->
                    <div class="mt-xl">
                        <div class="detail-meta-row">
                            <span class="detail-meta-label">执行时间</span>
                            <span class="detail-meta-value" id="rvStartTime">—</span>
                        </div>
                        <div class="detail-meta-row">
                            <span class="detail-meta-label">作者</span>
                            <span class="detail-meta-value" id="rvWriter">—</span>
                        </div>
                        <div class="detail-meta-row">
                            <span class="detail-meta-label">写入时间</span>
                            <span class="detail-meta-value" id="rvWriteTime">—</span>
                        </div>
                    </div>

                    <!-- 通过 / 驳回 操作按钮 -->
                    <div class="review-actions">
                        <hcw-button id="approveBtn" primary flat class="btn-min-lg">通过</hcw-button>
                        <hcw-button id="rejectBtn" variant="danger" flat class="btn-min-lg">驳回</hcw-button>
                    </div>
                </hcw-card>
            </div>

        </div>
    </hcw-article>

    <hcw-body-footer></hcw-body-footer>

    <script src="/src/pages/admin-review.js" type="module"></script>
</body>

</html>
