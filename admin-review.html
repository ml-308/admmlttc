<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>管理员 - 时刻表审核</title>
    <link rel="stylesheet" href="style/index.css">
    <link rel="stylesheet" href="style/timetable.css">
    <link rel="stylesheet" href="style/timetable-detail.css">
    <script src="lib/ui/init.mjs" type="module"></script>
    <script src="/src/auth-header.js" type="module"></script>
</head>

<body>
    <hcw-body-header>
        <hcw-button flat fill style="min-width: 5rem;" id="backBtn">返回</hcw-button>
        <div class="logo-area">
            <div class="logo-text">MLTTC - 时刻表审核</div>
        </div>
        <p hidden-on-mobile style="margin-left: auto; color: var(--text-muted)">管理员面板</p>
        <div id="headerAuthArea">
            <hcw-button id="themeToggleBtn" flat icon large aria-label="切换主题">🌙</hcw-button>
            <span style="font-size:0.82rem; color:var(--text-muted);" id="adminEmailDisplay"></span>
            <hcw-button id="logoutBtn" flat style="min-width: 4rem; font-size:0.82rem;">退出</hcw-button>
        </div>
    </hcw-body-header>

    <hcw-article>
        <!-- 时刻表审核页面：审核入口按钮 + 已审核时刻表 -->
        <div id="reviewEntrance">
            <div class="menu-bar">
                <hcw-button id="startReviewBtn" primary flat style="min-width: 12rem; font-size:1rem;">
                    审核时刻表
                </hcw-button>
            </div>

            <!-- 已审核时刻表（卡片 + 删除按钮） -->
            <hcw-card style="margin-top:1.5rem;">
                <hcw-card-title style="font-size:1.1rem; display:flex; align-items:center; justify-content:space-between;">
                    <span style="color:var(--success);">已审核时刻表</span>
                    <span id="reviewedCount" style="font-size:0.82rem; color:var(--text-muted);">0 条</span>
                </hcw-card-title>
                <div id="reviewedLoading" style="text-align:center; padding:2rem 0; color:var(--text-muted);">加载中...</div>
                <div id="reviewedEmpty" class="hidden" style="text-align:center; padding:2rem 0; color:var(--text-muted);">暂无已审核时刻表</div>
                <div id="reviewedList" class="result-area result-list" style="margin-top:0.5rem;"></div>
            </hcw-card>
        </div>

        <!-- 审核工作区：点击"审核时刻表"后逐条展示未审核时刻表 -->
        <div id="reviewWorkArea" class="hidden">

            <!-- 加载状态 -->
            <div id="reviewLoading" class="detail-loading">加载中...</div>

            <!-- 无待审核 / 全部处理完毕（可返回时刻表审核页面） -->
            <div id="reviewEmpty" class="detail-loading hidden">
                <p id="reviewEmptyText">暂无待审核时刻表</p>
                <hcw-button id="reviewBackBtn" primary flat style="min-width: 8rem; margin-top: 1rem;">返回</hcw-button>
            </div>

            <!-- 单条待审核时刻表详情 -->
            <div id="reviewCard" class="hidden">
                <hcw-card>
                    <hcw-card-title style="font-size:1.1rem; display:flex; align-items:center; justify-content:space-between;">
                        <span>时刻表审核</span>
                        <span id="reviewProgress" style="font-size:0.82rem; color:var(--text-muted);">0/0</span>
                    </hcw-card-title>
                    <div class="detail-info-grid" style="margin-top:0.5rem;">
                        <div class="detail-info-item">
                            <span class="detail-label">ID</span>
                            <span class="detail-value" id="rvId">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">城市</span>
                            <span class="detail-value" id="rvCity">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">线路</span>
                            <span class="detail-value" id="rvWay">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">起点</span>
                            <span class="detail-value" id="rvStart">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">终点</span>
                            <span class="detail-value" id="rvEnd">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">执行时间</span>
                            <span class="detail-value" id="rvStartTime">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">作者</span>
                            <span class="detail-value" id="rvWriter">—</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-label">写入时间</span>
                            <span class="detail-value" id="rvWriteTime">—</span>
                        </div>
                        <div class="detail-info-item full-width">
                            <span class="detail-label">备注</span>
                            <span class="detail-value" id="rvSpecial">—</span>
                        </div>
                    </div>
                    <!-- 通过 / 驳回 操作按钮 -->
                    <div style="display:flex; gap:1rem; justify-content:center; margin-top:1.25rem;">
                        <hcw-button id="approveBtn" primary flat style="min-width:6rem;">通过</hcw-button>
                        <hcw-button id="rejectBtn" variant="danger" flat style="min-width:6rem;">驳回</hcw-button>
                    </div>
                </hcw-card>
            </div>

        </div>
    </hcw-article>

    <hcw-body-footer></hcw-body-footer>

    <script src="/src/pages/admin-review.js" type="module"></script>
</body>

</html>
